# Runs the tests, and the dashboard itself, on Linux, Windows and macOS.
name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: tests, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Python the package claims to support, and the newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  run:
    name: start it, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installed the way a user gets it, not run from the source folder.
      - run: python -m pip install .
      - name: Start the dashboard and ask it for a reading
        shell: bash
        env:
          # Pings and look-ups are tried for real; the speed test would move 75 MB for nothing.
          DASH_SPEEDTEST_HOURS: "0"
        run: |
          cd "$RUNNER_TEMP"
          rackside --version
          rackside --port 8787 > server.log 2>&1 &
          # Every system must be able to read its network and hardware. Docker is only there on some.
          python "$GITHUB_WORKSPACE/tests/smoke.py" http://127.0.0.1:8787 --require network,hardware || { echo "--- server log"; cat server.log; exit 1; }

  install-unix:
    name: install script, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RACKSIDE_REPO: https://github.com/${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Give this user somewhere to run services of its own (a real machine has that already)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: Note what is on the machine before
        run: python3 tests/footprint.py "$RUNNER_TEMP/note.json"
      - name: The readme's way of passing options
        run: curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh -s -- --help | grep -e "--lan"
      # Piped from GitHub, exactly as the readme says, but at the commit being tested. Not started
      # yet: a first start runs a speed test, which would move 75 MB for nothing.
      - name: Install into a folder that is not there yet
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh -s -- --ref "$GITHUB_SHA" --no-service
          ls -A ~/rackside
          test -x ~/rackside/bin/rackside
          test -x ~/rackside/uninstall.sh
          ~/rackside/bin/rackside --version
          echo "DASH_SPEEDTEST_HOURS=0" >> ~/rackside/env
      - name: Install again, this time started by the system
        run: sh install.sh --ref "$GITHUB_SHA"
      - name: Ask what the system started for a reading
        run: python3 tests/smoke.py http://127.0.0.1:8787 --require network,hardware
      - name: Nothing but the start-up entry is outside the folder
        run: |
          python3 tests/footprint.py "$RUNNER_TEMP/note.json" --allow ~/rackside \
            --allow ~/.config/systemd/user/rackside.service --allow ~/.config/systemd/user/default.target.wants/rackside.service \
            --allow ~/Library/LaunchAgents/io.github.nprev-dev.rackside.plist
          test -s ~/rackside/rackside.log
          test -s ~/rackside/state.json
          du -sh ~/rackside
      - name: Install again over the running one, on another port and open to the network
        run: |
          sh install.sh --ref "$GITHUB_SHA" --port 8790 --lan | tee again.txt
          grep -q "From other machines" again.txt
          grep -qx "DASH_SPEEDTEST_HOURS=0" ~/rackside/env
          grep -qx "DASH_PORT=8790" ~/rackside/env
          grep -qx "DASH_HOST=0.0.0.0" ~/rackside/env
          if curl -fs http://127.0.0.1:8787/api/snapshot > /dev/null; then echo "still answering on the old port"; exit 1; fi
      - name: Ask it again, where it now listens
        run: python3 tests/smoke.py http://127.0.0.1:8790 --settle 3 --require network,hardware
      - name: What it logged
        if: always()
        run: cat ~/rackside/rackside.log || journalctl --user -u rackside --no-pager -n 80 || true
      - name: Uninstall with the script in the folder, and find nothing left
        run: |
          sh ~/rackside/uninstall.sh
          if curl -fs http://127.0.0.1:8790/api/snapshot > /dev/null; then echo "still running"; exit 1; fi
          test ! -e ~/rackside
          test ! -e ~/.config/systemd/user/rackside.service
          test ! -e ~/Library/LaunchAgents/io.github.nprev-dev.rackside.plist
          python3 tests/footprint.py "$RUNNER_TEMP/note.json"
      - name: Uninstalling what is not there is not an error
        run: curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | sh -s -- --uninstall

  install-windows:
    name: install script, windows-latest
    runs-on: windows-latest
    env:
      RACKSIDE_REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Note what is on the machine before
        run: python tests/footprint.py "$env:RUNNER_TEMP\note.json"
      - name: The readme's way of passing options, from the command prompt
        shell: cmd
        run: |
          powershell -ExecutionPolicy ByPass -c "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/%GITHUB_REPOSITORY%/%GITHUB_SHA%/install.ps1))) -Help" | findstr /C:"-Lan"
      # Not started yet: a first start runs a speed test, which would move 75 MB for nothing.
      - name: Install into a folder that is not there yet
        shell: powershell
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"))) -Ref $env:GITHUB_SHA -NoStartup
          Get-ChildItem -Force "$HOME\rackside" | ForEach-Object { $_.Name }
          & "$HOME\rackside\bin\rackside.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the command does not run" }
          foreach ($name in "uninstall.cmd", "uninstall.ps1", ".rackside", "env") {
            if (-not (Test-Path "$HOME\rackside\$name")) { throw "the folder lacks $name" }
          }
          # Written the way Notepad and Windows PowerShell write: with a marker in front of the first line.
          Set-Content -Encoding UTF8 "$HOME\rackside\env" "DASH_SPEEDTEST_HOURS=0", "# kept from an earlier install"
      # Fetched and run as one piece of text, as the readme says, in the PowerShell every Windows
      # has. The text is that of the commit being tested, told to install that same commit.
      - name: Install again, this time started by Windows
        shell: powershell
        run: |
          $text = Invoke-RestMethod "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"
          $told = $text.Replace('[string]$Ref = ""', '[string]$Ref = "' + $env:GITHUB_SHA + '"')
          if ($told -eq $text) { throw "the script no longer has the line this test changes" }
          $told | Invoke-Expression
          foreach ($name in "UV_UNMANAGED_INSTALL", "UV_PYTHON_INSTALL_DIR", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR") {
            if ([Environment]::GetEnvironmentVariable($name)) { throw "$name was left set in this PowerShell" }
          }
      - name: Ask what was started for a reading
        run: python tests/smoke.py http://127.0.0.1:8787 --require network,hardware
      - name: Nothing but the start-up entry is outside the folder
        shell: powershell
        run: |
          python tests/footprint.py "$env:RUNNER_TEMP\note.json" --allow "$HOME\rackside" --allow "registry:Run/Rackside"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($name in "rackside.log", "state.json") {
            if (-not (Test-Path "$HOME\rackside\$name")) { throw "the folder lacks $name" }
          }
          "{0:N0} MB in the folder" -f ((Get-ChildItem -Recurse -Force "$HOME\rackside" | Measure-Object Length -Sum).Sum / 1MB)
      - name: Install again over the running one, on another port and open to the network, in the newer PowerShell
        shell: pwsh
        run: |
          ./install.ps1 -Ref $env:GITHUB_SHA -Port 8790 -Lan
          $settings = Get-Content "$HOME\rackside\env"
          $settings
          foreach ($line in "DASH_SPEEDTEST_HOURS=0", "# kept from an earlier install", "DASH_PORT=8790", "DASH_HOST=0.0.0.0") {
            if ($settings -notcontains $line) { throw "settings file lacks: $line" }
          }
          $entry = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Rackside
          "start-up entry: $entry"
          if ($entry -ne "`"$HOME\rackside\bin\racksidew.exe`"") { throw "the start-up entry is not the one expected" }
          try { $null = Invoke-WebRequest -TimeoutSec 3 http://127.0.0.1:8787/api/snapshot; $old = $true } catch { $old = $false }
          if ($old) { throw "still answering on the old port" }
      - name: Ask it again, where it now listens
        run: python tests/smoke.py http://127.0.0.1:8790 --settle 3 --require network,hardware
      - name: What it logged
        if: always()
        shell: powershell
        run: Get-Content "$HOME\rackside\rackside.log" -ErrorAction SilentlyContinue
      # The way a double-click does it: a command prompt of its own, standing in the folder that
      # is about to go.
      - name: Uninstall with the script in the folder, and find nothing left
        shell: cmd
        run: |
          start "" /b /wait /d "%USERPROFILE%\rackside" cmd /c uninstall.cmd
          if errorlevel 1 exit /b 1
          if exist "%USERPROFILE%\rackside" (echo the folder is still there & exit /b 1)
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Rackside >nul 2>&1 && (echo the start-up entry is still there & exit /b 1)
          python tests/footprint.py "%RUNNER_TEMP%\note.json"
      - name: Uninstalling what is not there is not an error
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Uninstall
          try { $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8790/api/snapshot; $running = $true } catch { $running = $false }
          if ($running) { throw "still running" }

  takeover:
    name: take over a v0.1.0 install, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RACKSIDE_REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Give this user somewhere to run services of its own (a real machine has that already)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: Install v0.1.0, the last release under the old name, with its own installer
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.0/install.sh" -o old-install.sh
          sh old-install.sh --no-service
          printf '%s\n' "DASH_SPEEDTEST_HOURS=0" "# my own setting" >> ~/rack-dashboard/env
          sh old-install.sh
          test -s ~/rack-dashboard/state.json
      - name: Install the code being tested over it
        if: runner.os != 'Windows'
        run: |
          sh install.sh --ref "$GITHUB_SHA" | tee takeover.txt
          grep -q "Taking over the install from before the rename" takeover.txt
          test ! -e ~/rack-dashboard
          test ! -e ~/.config/systemd/user/rack-dashboard.service
          test ! -e ~/Library/LaunchAgents/io.github.nprev-dev.rack-dashboard.plist
          grep -qx "# my own setting" ~/rackside/env
          grep -qx "DASH_SPEEDTEST_HOURS=0" ~/rackside/env
          test -s ~/rackside/state.json
          test ! -e ~/rackside/bin/rack-dashboard
          test ! -e ~/rackside/tools/rack-dashboard
          expected=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' rack_dashboard/__init__.py)
          answered=$(curl -fs http://127.0.0.1:8787/api/snapshot | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          test "$answered" = "$expected"
          sh ~/rackside/uninstall.sh
          test ! -e ~/rackside
      - name: Install v0.1.0, the last release under the old name, with its own installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $old = Invoke-RestMethod "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.1.0/install.ps1"
          & ([scriptblock]::Create($old)) -NoStartup
          Add-Content "$HOME\rack-dashboard\env" "DASH_SPEEDTEST_HOURS=0", "# my own setting"
          & ([scriptblock]::Create($old))
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").RackDashboard) { throw "v0.1.0 has no start-up entry" }
          if (-not (Test-Path "$HOME\rack-dashboard\state.json")) { throw "v0.1.0 saved nothing" }
      - name: Install the code being tested over it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Ref $env:GITHUB_SHA
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if ($run.RackDashboard) { throw "the old start-up entry is still there" }
          if (-not $run.Rackside) { throw "no start-up entry under the new name" }
          if (Test-Path "$HOME\rack-dashboard") { throw "the old folder is still there" }
          $settings = Get-Content "$HOME\rackside\env"
          foreach ($line in "DASH_SPEEDTEST_HOURS=0", "# my own setting") { if ($settings -notcontains $line) { throw "settings lost: $line" } }
          if (-not (Test-Path "$HOME\rackside\state.json")) { throw "history lost" }
          foreach ($leftover in "bin\rack-dashboard.exe", "bin\rack-dashboardw.exe", "tools\rack-dashboard") { if (Test-Path "$HOME\rackside\$leftover") { throw "left over: $leftover" } }
          $expected = (Select-String -Path rack_dashboard\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $answered = (Invoke-RestMethod http://127.0.0.1:8787/api/snapshot).version
          if ($answered -ne $expected) { throw "answering as $answered, not $expected" }
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Uninstall
          if (Test-Path "$HOME\rackside") { throw "the folder is still there" }
