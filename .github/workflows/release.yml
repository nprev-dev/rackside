# Makes a release when a tag like v0.1.0 is pushed. Every other push to a ci/ branch rehearses it:
# the same build and the same install from the built files, served by a stand-in for GitHub, with
# nothing published.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The version, the tag and the changelog agree
        id: check
        # Taken apart in two lines so that a failed check fails the step: inside echo, it would not.
        run: |
          version=$(python .github/release_notes.py "$GITHUB_REF" notes.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: The package, and installers that know which release they belong to
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          test -n "$VERSION"
          python -m pip install build
          python -m build --outdir dist
          sed "s/^RELEASE=\"\"$/RELEASE=\"$VERSION\"/" install.sh > dist/install.sh
          sed "s/^    Release = \"\"$/    Release = \"$VERSION\"/" install.ps1 > dist/install.ps1
          grep -qx "RELEASE=\"$VERSION\"" dist/install.sh
          grep -qx "    Release = \"$VERSION\"" dist/install.ps1
          cp notes.md dist-notes.md
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist
            dist-notes.md

  rehearse:
    name: install from the built files, ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RACKSIDE_REPO: http://127.0.0.1:8900
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: A stand-in for GitHub, serving the built release
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" tests/fake_github.py 8900 dist "$VERSION" 2> "$RUNNER_TEMP/fake-github.log" &
          for _ in $(seq 20); do curl -fs -o /dev/null "http://127.0.0.1:8900/releases/download/v$VERSION/install.sh" && break; sleep 1; done
      - name: The readme's command, then the installer from the repository, which hands over
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "$RACKSIDE_REPO/releases/latest/download/install.sh" | sh -s -- --no-service
          test "$(~/rackside/bin/rackside --version)" = "rackside $VERSION"
          sh install.sh --no-service | tee again.txt
          grep -q "Installing rackside $VERSION" again.txt
          sh install.sh --version "$VERSION" --no-service
          if sh install.sh --version 9.9.9 --no-service 2> unknown.txt; then echo "an unknown release was accepted"; exit 1; fi
          grep -q "could not download the installer of release 9.9.9" unknown.txt
          sh ~/rackside/uninstall.sh
          test ! -e ~/rackside
      - name: The readme's command, then the installer from the repository, which hands over
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm "$env:RACKSIDE_REPO/releases/latest/download/install.ps1"))) -NoStartup
          $said = & "$HOME\rackside\bin\rackside.exe" --version
          if ($said -ne "rackside $env:VERSION") { throw "installed: $said" }
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -NoStartup
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Version $env:VERSION -NoStartup
          $refused = $false
          try { & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Version 9.9.9 -NoStartup } catch { $refused = $_.Exception.Message -like "*could not download the installer of release 9.9.9*" }
          if (-not $refused) { throw "an unknown release was accepted" }
          & ([scriptblock]::Create((Get-Content -Raw ./install.ps1))) -Uninstall
          if (Test-Path "$HOME\rackside") { throw "the folder is still there" }
      - name: What the stand-in was asked for
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/fake-github.log"

  publish:
    name: publish the release
    needs: [build, rehearse]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" dist/* --verify-tag --title "Rackside $VERSION" --notes-file dist-notes.md

  verify:
    name: install the published release, ${{ matrix.os }}
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Exactly as the readme says
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh -s -- --no-service
          test "$(~/rackside/bin/rackside --version)" = "rackside $VERSION"
          sh ~/rackside/uninstall.sh
      - name: Exactly as the readme says
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1))) -NoStartup
          $said = & "$HOME\rackside\bin\rackside.exe" --version
          if ($said -ne "rackside $env:VERSION") { throw "installed: $said" }
          & ([scriptblock]::Create((irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1))) -Uninstall
