# One run only, never part of the repository: how PowerShell takes a script served as a release file.
name: probe
on:
  push:
    branches: ["ci/**"]
permissions:
  contents: read
jobs:
  irm:
    runs-on: windows-latest
    steps:
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $t = irm https://github.com/astral-sh/uv/releases/latest/download/uv-installer.ps1
          "type: " + $t.GetType().FullName + ", length " + $t.Length + ", starts: " + ("$t".Substring(0, 30) -replace "`r|`n", " ")
          $null = [scriptblock]::Create($t); "as a script block: ok"
      - name: PowerShell 7
        shell: pwsh
        run: |
          $t = irm https://github.com/astral-sh/uv/releases/latest/download/uv-installer.ps1
          "type: " + $t.GetType().FullName + ", length " + $t.Length + ", starts: " + ("$t".Substring(0, 30) -replace "`r|`n", " ")
          $null = [scriptblock]::Create($t); "as a script block: ok"
      - name: The command prompt, the way the readme's one-liner runs
        shell: cmd
        run: powershell -ExecutionPolicy ByPass -c "$t = irm https://github.com/astral-sh/uv/releases/latest/download/uv-installer.ps1; $t.GetType().FullName"
